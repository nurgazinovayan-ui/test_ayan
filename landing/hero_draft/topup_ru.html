<section class="hs" id="topup"><div class="wrap hs-in"><div class="hs-pay"><label for="hsTop">Пополняете</label><b data-o="usd">$50</b></div><input id="hsTop" type="range" min="10" max="500" step="10" value="50" aria-label="Сумма пополнения в долларах"><div class="hs-out"><div><b data-o="credits">2 750</b><span>кредитов</span></div><div><b data-o="photo">≈ 687</b><span>фото<button type="button" class="hs-q" aria-label="Как посчитано: Nano Banana 2.1 · 1K · 4 кредита за фото">?<i role="tooltip">Nano Banana 2.1 · 1K · 4 кредита за фото</i></button></span></div><div><b data-o="video">≈ 57</b><span>видео по 5 с<button type="button" class="hs-q r" aria-label="Как посчитано: Seedance 2.5 · 480p · 5 секунд со звуком · 48 кредитов">?<i role="tooltip">Seedance 2.5 · 480p · 5 секунд со звуком · 48 кредитов</i></button></span></div><div><b data-o="music">≈ 196</b><span>треков<button type="button" class="hs-q r" aria-label="Как посчитано: Suno V6 · два варианта трека за запрос · 14 кредитов">?<i role="tooltip">Suno V6 · два варианта трека за запрос · 14 кредитов</i></button></span></div></div></div><script>
(function () {
  var root = document.getElementById('topup'); if (!root) return;
  var COST = { photo: 4, video: 48, music: 14 }, GAP = ' ', r = root.querySelector('input');
  function sp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, GAP); }
  function draw() {
    var usd = Number(r.value), credits = usd * (usd < 50 ? 50 : usd < 200 ? 55 : 60);
    root.querySelector('[data-o=usd]').textContent = '$' + usd;
    root.querySelector('[data-o=credits]').textContent = sp(credits);
    for (var k in COST) root.querySelector('[data-o=' + k + ']').textContent = '≈ ' + sp(Math.floor(credits / COST[k]));
    r.style.setProperty('--hspos', ((usd - 10) / 490 * 100) + '%');
  }
  r.addEventListener('input', draw); draw();
})();
</script></section>
